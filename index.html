<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="My personal GitHub Pages site — a simple Hello World demo." />
  <title>Isha's GitHub Page</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      margin: 0;
      line-height: 1.6;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      background: #fff;
      color: #111;
    }
    header, footer { background: #f7f7f7; padding: 1rem; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .container { max-width: 900px; width: 100%; text-align: center; }
    h1 { margin: 0.25rem 0; font-size: clamp(1.5rem, 3.6vw, 2.5rem); }
    p { margin: 0.5rem 0; color: #333; }
    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    small { color: #666; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h2>Welcome</h2>
    </div>
  </header>

  <main>
    <div class="container" role="main" aria-labelledby="main-heading">
      <h1 id="main-heading">Hello, world!</h1>
      <p>This is my first GitHub Pages site. Welcome — I'm Isha.</p>
      <p><a href="https://github.com/Isha-012" rel="noopener noreferrer" target="_blank">View my GitHub profile</a></p>
    </div>
  </main>

  <footer>
    <div class="container">
      <small>Built with ❤️ on GitHub Pages</small>
    </div>
  </footer>
</body>
</html>
